<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ7kK1UTb7QfQ2L1QvT2lD6H0y/3QWk=" crossorigin="">
  <script src="https://cdn.tailwindcss.com"></script><title>DRIVOZA · Eco route</title>
  <style>#map { height: calc(100vh - 260px); min-height: 420px; }.driver-marker { background:#2563eb; border:3px solid white; border-radius:50%; box-shadow:0 0 0 5px #2563eb55; width:18px; height:18px; }</style>
</head>
<body class="bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-4xl px-5 pb-24 pt-8"><header class="mb-6 flex items-center justify-between"><a href="/hud" class="text-xl font-extrabold">DRIVOZA</a><span class="rounded-full bg-emerald-400/10 px-3 py-1 text-sm font-semibold text-emerald-300">Eco route active</span></header>
    <section class="mb-4 rounded-2xl bg-slate-900 p-5"><p class="text-xs font-bold uppercase tracking-[.18em] text-emerald-400">CarbonStride planner</p><h1 class="mt-1 text-2xl font-bold">A safer, lower-impact route</h1><p id="route-summary" class="mt-1 text-sm text-slate-400">Loading safe waypoints…</p></section>
    <div id="map" class="overflow-hidden rounded-3xl border border-slate-800 shadow-2xl"></div>
    <section class="mt-4 flex flex-wrap gap-3 text-sm"><span class="rounded-full bg-emerald-500/15 px-3 py-2 text-emerald-300">● ≤ 50 km/h safe zone</span><span class="rounded-full bg-amber-500/15 px-3 py-2 text-amber-300">● Caution / school zone</span><span class="rounded-full bg-blue-500/15 px-3 py-2 text-blue-300">● Your live position</span></section>
  </main>
  <nav class="fixed bottom-0 left-0 right-0 border-t border-slate-800 bg-slate-950/95 px-4 py-3 backdrop-blur"><div class="mx-auto flex max-w-lg justify-around text-sm"><a href="/hud" class="text-slate-300">Drive</a><a href="/routes" class="font-bold text-emerald-400">Eco</a><a href="/safety" class="text-slate-300">Safety</a><a href="/login" class="text-slate-300">Login</a></div></nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([12.969, 77.600], 14); L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    let driverMarker, routeLayer;
    const driverIcon = L.divIcon({ className: '', html: '<div class="driver-marker" aria-label="Current position"></div>', iconSize: [18,18], iconAnchor:[9,9] });
    async function drawRoute() { const response = await fetch('/api/routes/eco'); const route = await response.json(); const points = [route.start, ...route.waypoints, route.end];
      routeLayer = L.polyline(points.map(point => [point.latitude, point.longitude]), { color:'#34d399', weight:6, opacity:.9 }).addTo(map); map.fitBounds(routeLayer.getBounds(), {padding:[35,35]});
      L.marker([route.start.latitude, route.start.longitude]).addTo(map).bindPopup(`<b>${route.start.name}</b><br>Route start`); L.marker([route.end.latitude, route.end.longitude]).addTo(map).bindPopup(`<b>${route.end.name}</b><br>Destination`);
      route.waypoints.forEach(point => { const caution = Boolean(point.hazard); L.circleMarker([point.latitude, point.longitude], {radius:9, color:caution ? '#f59e0b' : '#34d399', fillColor:caution ? '#f59e0b' : '#34d399', fillOpacity:.9}).addTo(map).bindPopup(`<b>${point.name}</b><br>${point.speed_limit_kmh} km/h${point.hazard ? `<br>⚠ ${point.hazard}` : ''}`); });
      document.querySelector('#route-summary').textContent = `${route.start.name} to ${route.end.name} · ${route.waypoints.length} safety-aware waypoints`;
    }
    async function updatePosition() { try { const data = await (await fetch('/api/telemetry/live')).json(); const point = [data.latitude, data.longitude]; if (driverMarker) driverMarker.setLatLng(point); else driverMarker = L.marker(point, {icon:driverIcon, zIndexOffset:1000}).addTo(map).bindPopup('Your current position'); } catch (error) { console.warn('Live position unavailable', error); } }
    drawRoute(); updatePosition(); setInterval(updatePosition, 3000);
  </script>
</body></html>
