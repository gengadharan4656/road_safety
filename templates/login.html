<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YuvaDrive · Profile</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell" style="max-width:500px"><a class="brand" href="/dashboard">Yuva<b>Drive</b></a><section class="card" style="margin-top:28px"><div class="eyebrow">Demo profile</div><h1>Welcome back</h1><p class="muted">Use any valid email and password to enter the local prototype.</p><form id="form"><label>Email<br><input required type="email" name="email" style="width:100%;padding:12px;margin:6px 0 14px;border:1px solid #dce5f1;border-radius:10px"></label><label>Password<br><input required type="password" name="password" style="width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce5f1;border-radius:10px"></label><button class="button">Sign in</button></form><p class="muted" id="message"></p></section></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;let r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});message.textContent=r.ok?'Signed in. Opening your dashboard…':'Please check your details.';if(r.ok)setTimeout(()=>location='/dashboard',450)}</script></body></html>
