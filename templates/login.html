<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>DRIVOZA · Login</title></head>
<body class="grid min-h-screen place-items-center bg-slate-950 p-5 text-slate-100"><form id="login-form" class="w-full max-w-sm rounded-3xl bg-slate-900 p-8"><a href="/hud" class="text-xl font-extrabold">DRIVOZA</a><h1 class="mt-8 text-2xl font-bold">Welcome back</h1><label class="mt-5 block text-sm">Email<input name="email" type="email" required class="mt-1 w-full rounded-xl bg-slate-800 p-3"></label><label class="mt-4 block text-sm">Password<input name="password" type="password" required class="mt-1 w-full rounded-xl bg-slate-800 p-3"></label><button class="mt-6 w-full rounded-xl bg-blue-600 p-3 font-bold">Sign in</button><p id="result" class="mt-4 text-sm text-slate-400"></p></form><script>document.querySelector('#login-form').addEventListener('submit', async event => { event.preventDefault(); const form = new FormData(event.currentTarget); const response = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))}); document.querySelector('#result').textContent = response.ok ? 'Signed in. Opening drive mode…' : 'Unable to sign in.'; if(response.ok) setTimeout(()=>location.href='/hud',500); });</script></body></html>
