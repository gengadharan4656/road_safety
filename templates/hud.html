<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YuvaDrive · Drive mode</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell hud"><nav class="nav"><a class="brand" href="/dashboard">Yuva<b>Drive</b></a><div class="navlinks"><a href="/dashboard">Home</a><a class="active" href="/hud">Drive</a><a href="/routes">Routes</a></div></nav><div class="eyebrow">Drive mode · live demo</div><section class="card"><p class="muted" style="text-align:center;margin:0">Current speed</p><div class="speed"><span id="speed">--</span><small> km/h</small></div><div class="row"><span>Road limit <b id="limit">--</b> km/h</span><span id="status" class="badge">Connecting</span></div><div class="progress"><i id="bar" style="width:0%"></i></div></section><section id="safety-nudge" class="card safe" style="margin-top:16px"><div class="eyebrow">Smart safety nudge</div><h2 id="nudge">Loading your road advisory…</h2><p id="principle" class="muted"></p><div class="actions"><button class="button alt" onclick="setSpeed(42)">Demo safe speed</button><button class="button alt" onclick="setSpeed(58)">Demo caution</button><button class="button alt" onclick="setSpeed(66)">Demo reset</button></div></section><section class="metrics"><div class="metric"><strong id="duration">--:--</strong>trip duration</div><div class="metric"><strong id="distance">--</strong>km travelled</div><div class="metric"><strong id="language">EN</strong>voice language</div></section><button class="button" style="margin-top:18px;width:100%" onclick="completeTrip()">End trip &amp; save progress</button><p class="muted" id="result"></p></main><script>let cue='';const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}function render(d){const nudgeCard=document.getElementById('safety-nudge');speed.textContent=Math.round(d.speed_kmh);limit.textContent=d.speed_limit_kmh;duration.textContent=fmt(d.trip_duration_seconds);distance.textContent=d.distance_km.toFixed(1);language.textContent=d.language.toUpperCase();bar.style.width=`${Math.min(100,d.speed_kmh/d.speed_limit_kmh*100)}%`;const n=d.safety_nudge;status.textContent=n.active?'Gentle reset':'Within limit';nudge.textContent=n.message;principle.textContent=n.principle;nudgeCard.className=`card ${n.severity}`;if(n.audio_cue&&n.audio_cue!==cue)say(n.message);cue=n.audio_cue}async function poll(){render(await fetch('/api/telemetry/live').then(r=>r.json()))}async function setSpeed(v){render(await fetch('/api/telemetry/update',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({speed_kmh:v,latitude:12.9719,longitude:77.5943})}).then(r=>r.json()))}async function completeTrip(){const d=await fetch('/api/trips/complete',{method:'POST'}).then(r=>r.json());result.textContent=`+${d.points_earned} points — ${d.message}`}poll();setInterval(poll,5000);</script></body></html>
