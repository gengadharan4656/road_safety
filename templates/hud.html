<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>DRIVOZA · Drive mode</title>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-lg flex-col px-5 pb-24 pt-10">
    <header class="mb-8 flex items-center justify-between"><a href="/hud" class="text-xl font-extrabold tracking-tight">DRIVOZA</a><a href="/login" class="rounded-full bg-slate-800 px-4 py-2 text-sm">Driver profile</a></header>
    <p class="text-sm font-semibold uppercase tracking-[.2em] text-emerald-400">Drive mode · Live</p>
    <section class="mt-5 rounded-3xl border border-slate-800 bg-slate-900 p-7 text-center shadow-2xl">
      <p class="text-sm text-slate-400">Current speed</p><div><span id="current-speed" class="text-8xl font-black tracking-tighter">--</span><span class="ml-2 text-xl text-slate-400">km/h</span></div>
      <div class="mt-6 flex justify-between text-sm"><span>Limit <strong id="speed-limit">--</strong> km/h</span><span id="speed-status" class="font-semibold text-emerald-400">Connecting…</span></div>
      <div class="mt-3 h-3 overflow-hidden rounded-full bg-slate-700"><div id="speed-progress" class="h-full rounded-full bg-gradient-to-r from-blue-500 to-emerald-400 transition-all duration-500" style="width:0%"></div></div>
    </section>
    <section class="mt-5 grid grid-cols-2 gap-4"><div class="rounded-2xl bg-slate-900 p-5"><p class="text-sm text-slate-400">Trip duration</p><p id="trip-duration" class="mt-1 text-2xl font-bold">--:--</p></div><div class="rounded-2xl bg-slate-900 p-5"><p class="text-sm text-slate-400">Distance</p><p class="mt-1 text-2xl font-bold"><span id="distance">--</span> km</p></div></section>
    <section id="safety-nudge" class="mt-5 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-5"><p class="text-sm font-bold uppercase tracking-wider text-emerald-300">Smart Safety Nudge</p><p id="nudge-message" class="mt-2 text-lg font-semibold">Loading your road advisory…</p><p id="nudge-status" class="mt-2 text-sm text-slate-400">Live safety monitoring is enabled.</p></section>
  </main>
  <nav class="fixed bottom-0 left-0 right-0 border-t border-slate-800 bg-slate-950/95 px-4 py-3 backdrop-blur"><div class="mx-auto flex max-w-lg justify-around text-sm"><a href="/hud" class="font-bold text-blue-400">Drive</a><a href="/routes" class="text-slate-300">Eco</a><a href="/safety" class="text-slate-300">Safety</a><a href="/login" class="text-slate-300">Login</a></div></nav>
  <script>
    let lastAudioCue = '';
    const formatDuration = seconds => `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
    function announce(message) { if ('speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(message)); } }
    function renderTelemetry(data) {
      const speed = Math.round(data.speed_kmh), limit = data.speed_limit_kmh, nudge = data.safety_nudge;
      document.querySelector('#current-speed').textContent = speed; document.querySelector('#speed-limit').textContent = limit;
      document.querySelector('#trip-duration').textContent = formatDuration(data.trip_duration_seconds); document.querySelector('#distance').textContent = data.distance_km.toFixed(1);
      document.querySelector('#speed-progress').style.width = `${Math.min(speed / limit * 100, 100)}%`;
      document.querySelector('#speed-status').textContent = nudge.active ? 'Slow down' : 'Within limit';
      document.querySelector('#speed-status').className = `font-semibold ${nudge.active ? 'text-amber-300' : 'text-emerald-400'}`;
      document.querySelector('#nudge-message').textContent = nudge.message; document.querySelector('#nudge-status').textContent = nudge.active ? 'Audio advisory enabled.' : 'Live safety monitoring is enabled.';
      if (nudge.audio_cue && nudge.audio_cue !== lastAudioCue) announce(nudge.message); lastAudioCue = nudge.audio_cue;
    }
    async function pollTelemetry() { try { const response = await fetch('/api/telemetry/live'); if (!response.ok) throw new Error('Telemetry unavailable'); renderTelemetry(await response.json()); } catch { document.querySelector('#speed-status').textContent = 'Offline'; } }
    pollTelemetry(); setInterval(pollTelemetry, 3000);
  </script>
</body></html>
